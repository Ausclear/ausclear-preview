<script>
  function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  }

  const mobileToggle = document.getElementById('mobileToggle');
  const navMenu = document.getElementById('navMenu');
  const dropdownTrigger = document.querySelector('.dropdown-trigger');
  const hasDropdown = document.querySelector('.has-dropdown');
  const navbar = document.querySelector('.navbar');

  const focusableElements = 'a[href], button:not([disabled])';
  let firstFocusable, lastFocusable;

  mobileToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    const isActive = mobileToggle.classList.toggle('active');
    mobileToggle.setAttribute('aria-expanded', isActive);
    navMenu.classList.toggle('active');

    if (navMenu.classList.contains('active')) {
      document.body.classList.add('menu-open');

      const focusables = navMenu.querySelectorAll(focusableElements);
      firstFocusable = focusables[0];
      lastFocusable = focusables[focusables.length - 1];

      setTimeout(() => firstFocusable?.focus(), 100);
    } else {
      document.body.classList.remove('menu-open');
      mobileToggle.focus();
    }
  });

  if (dropdownTrigger) {
    dropdownTrigger.addEventListener('click', function(e) {
      if (window.innerWidth <= 768) {
        e.preventDefault();
        e.stopPropagation();
        hasDropdown.classList.toggle('mobile-open');
      }
    });

    dropdownTrigger.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        if (window.innerWidth <= 768) {
          e.preventDefault();
          hasDropdown.classList.toggle('mobile-open');
        }
      }
    });
  }

  document.addEventListener('click', function(event) {
    if (window.innerWidth <= 768) {
      if (!event.target.closest('.navbar')) {
        navMenu.classList.remove('active');
        mobileToggle.classList.remove('active');
        mobileToggle.setAttribute('aria-expanded', 'false');
        if (hasDropdown) hasDropdown.classList.remove('mobile-open');
        document.body.classList.remove('menu-open');
      }
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && navMenu.classList.contains('active')) {
      navMenu.classList.remove('active');
      mobileToggle.classList.remove('active');
      mobileToggle.setAttribute('aria-expanded', 'false');
      if (hasDropdown) hasDropdown.classList.remove('mobile-open');
      document.body.classList.remove('menu-open');
      mobileToggle.focus();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Tab' || !navMenu.classList.contains('active')) return;

    const focusables = navMenu.querySelectorAll('a, button');
    if (!focusables.length) return;

    const first = focusables[0];
    const last = focusables[focusables.length - 1];

    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  });

  let startX = 0;

  navMenu.addEventListener('touchstart', e => {
    startX = e.changedTouches[0].clientX;
  });

  navMenu.addEventListener('touchend', e => {
    const endX = e.changedTouches[0].clientX;
    if (endX - startX > 80) {
      navMenu.classList.remove('active');
      mobileToggle.classList.remove('active');
      mobileToggle.setAttribute('aria-expanded', 'false');
      if (hasDropdown) hasDropdown.classList.remove('mobile-open');
      document.body.classList.remove('menu-open');
    }
  });

  document.querySelectorAll('.dropdown-item').forEach(link => {
    link.addEventListener('click', function() {
      if (window.innerWidth <= 768) {
        navMenu.classList.remove('active');
        mobileToggle.classList.remove('active');
        mobileToggle.setAttribute('aria-expanded', 'false');
        if (hasDropdown) hasDropdown.classList.remove('mobile-open');
        document.body.classList.remove('menu-open');
      }
    });
  });

  document.querySelectorAll('.nav-link:not(.dropdown-trigger)').forEach(link => {
    link.addEventListener('click', function() {
      if (window.innerWidth <= 768) {
        navMenu.classList.remove('active');
        mobileToggle.classList.remove('active');
        mobileToggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('menu-open');
      }
    });
  });

  // Only apply transitions to nav links we control
  // (prevents random links/tracking widgets from breaking navigation)
  document.querySelectorAll('.nav-link[href], .dropdown-item[href]').forEach(link => {
    link.addEventListener('click', function (e) {
      const href = this.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;
      if (this.hasAttribute('target')) return;

      // Resolve relative URLs safely
      let url;
      try { url = new URL(href, window.location.origin); }
      catch { return; }

      // Treat www and non-www as the same host
      const normaliseHost = h => h.replace(/^www\./, '');
      if (normaliseHost(url.hostname) !== normaliseHost(window.location.hostname)) return;

      // Don’t re-navigate to the same page
      const currentUrl = new URL(window.location.href);
      if (url.pathname.replace(/\/+$/, '') === currentUrl.pathname.replace(/\/+$/, '') && url.search === currentUrl.search && url.hash === currentUrl.hash) return;

      e.preventDefault();
      document.body.classList.add('page-transitioning');
      setTimeout(() => { window.location.href = url.href; }, 150);
    });
  });

  let lastScrollY = window.pageYOffset;

  const handleScroll = debounce(() => {
    const currentY = window.pageYOffset;

    if (currentY < 10) {
      navbar.classList.remove('hidden');
      lastScrollY = currentY;
      return;
    }

    if (currentY > lastScrollY && currentY > 80) {
      navbar.classList.add('hidden');
    } else {
      navbar.classList.remove('hidden');
    }

    lastScrollY = currentY;
  }, 25);

  window.addEventListener('scroll', handleScroll);

  const current = window.location.pathname.replace(/\/+$/, '');
  const currentHost = window.location.hostname;

  document.querySelectorAll('.nav-link, .dropdown-item').forEach(link => {
    const href = link.getAttribute('href');
    if (!href) return;

    if (href.startsWith('javascript:') || href.startsWith('http')) {
      try {
        const linkUrl = new URL(href);
        const linkPath = linkUrl.pathname.replace(/\/+$/, '');

        if (linkUrl.hostname === currentHost && linkPath === current && linkPath !== '') {
          link.classList.add('active');

          const dropdown = link.closest('.has-dropdown');
          if (dropdown) {
            dropdown.querySelector('.dropdown-trigger').classList.add('active');
          }
        }
      } catch (e) {
        // ignore
      }
    }
  });

  // No scramble. Just fade-in for a clean, stable brand.
  window.addEventListener('load', () => {
    const brand = document.getElementById('brand-line');
    const sub = document.getElementById('brand-sub');
    brand?.classList.add('fade-in');
    sub?.classList.add('fade-in');
  });
</script>
